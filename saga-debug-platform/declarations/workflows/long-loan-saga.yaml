# Long loan saga (long-saga/, synthetic, built for the defence demo): 20 steps, each its own
# container. A failure at step k is undone in reverse from k-1 down to 1. Services are the
# compose service names of project "longsaga".
workflow:
  name: LONG_LOAN_SAGA
  version: "1.0"
  runtimeScope: longsaga
  sources: [longsaga]

  steps:
    - id: RECEIVE_APPLICATION
      service: intake-service
      timeout: 10s
      compensation: UNDO_RECEIVE_APPLICATION
      events:
        started: RECEIVE_APPLICATION_STARTED
        completed: RECEIVE_APPLICATION_DONE
        failed: RECEIVE_APPLICATION_FAILED

    - id: VERIFY_IDENTITY
      service: identity-service
      timeout: 10s
      compensation: UNDO_VERIFY_IDENTITY
      events:
        started: VERIFY_IDENTITY_STARTED
        completed: VERIFY_IDENTITY_DONE
        failed: VERIFY_IDENTITY_FAILED

    - id: CHECK_BLACKLIST
      service: blacklist-service
      timeout: 10s
      compensation: UNDO_CHECK_BLACKLIST
      events:
        started: CHECK_BLACKLIST_STARTED
        completed: CHECK_BLACKLIST_DONE
        failed: CHECK_BLACKLIST_FAILED

    - id: PULL_CREDIT_REPORT
      service: credit-bureau-service
      timeout: 10s
      compensation: UNDO_PULL_CREDIT_REPORT
      events:
        started: PULL_CREDIT_REPORT_STARTED
        completed: PULL_CREDIT_REPORT_DONE
        failed: PULL_CREDIT_REPORT_FAILED

    - id: SCORE_CREDIT
      service: scoring-service
      timeout: 10s
      compensation: UNDO_SCORE_CREDIT
      events:
        started: SCORE_CREDIT_STARTED
        completed: SCORE_CREDIT_DONE
        failed: SCORE_CREDIT_FAILED

    - id: VERIFY_INCOME
      service: income-service
      timeout: 10s
      compensation: UNDO_VERIFY_INCOME
      events:
        started: VERIFY_INCOME_STARTED
        completed: VERIFY_INCOME_DONE
        failed: VERIFY_INCOME_FAILED

    - id: VERIFY_EMPLOYMENT
      service: employment-service
      timeout: 10s
      compensation: UNDO_VERIFY_EMPLOYMENT
      events:
        started: VERIFY_EMPLOYMENT_STARTED
        completed: VERIFY_EMPLOYMENT_DONE
        failed: VERIFY_EMPLOYMENT_FAILED

    - id: APPRAISE_COLLATERAL
      service: appraisal-service
      timeout: 10s
      compensation: UNDO_APPRAISE_COLLATERAL
      events:
        started: APPRAISE_COLLATERAL_STARTED
        completed: APPRAISE_COLLATERAL_DONE
        failed: APPRAISE_COLLATERAL_FAILED

    - id: INSURE_COLLATERAL
      service: insurance-service
      timeout: 10s
      compensation: UNDO_INSURE_COLLATERAL
      events:
        started: INSURE_COLLATERAL_STARTED
        completed: INSURE_COLLATERAL_DONE
        failed: INSURE_COLLATERAL_FAILED

    - id: PRICE_LOAN
      service: pricing-service
      timeout: 10s
      compensation: UNDO_PRICE_LOAN
      events:
        started: PRICE_LOAN_STARTED
        completed: PRICE_LOAN_DONE
        failed: PRICE_LOAN_FAILED

    - id: RESERVE_FUNDS
      service: treasury-service
      timeout: 10s
      compensation: UNDO_RESERVE_FUNDS
      events:
        started: RESERVE_FUNDS_STARTED
        completed: RESERVE_FUNDS_DONE
        failed: RESERVE_FUNDS_FAILED

    - id: APPROVE_RISK
      service: risk-service
      timeout: 10s
      compensation: UNDO_APPROVE_RISK
      events:
        started: APPROVE_RISK_STARTED
        completed: APPROVE_RISK_DONE
        failed: APPROVE_RISK_FAILED

    - id: GENERATE_CONTRACT
      service: contract-service
      timeout: 10s
      compensation: UNDO_GENERATE_CONTRACT
      events:
        started: GENERATE_CONTRACT_STARTED
        completed: GENERATE_CONTRACT_DONE
        failed: GENERATE_CONTRACT_FAILED

    - id: SIGN_CONTRACT
      service: esign-service
      timeout: 10s
      compensation: UNDO_SIGN_CONTRACT
      events:
        started: SIGN_CONTRACT_STARTED
        completed: SIGN_CONTRACT_DONE
        failed: SIGN_CONTRACT_FAILED

    - id: REGISTER_LIEN
      service: lien-service
      timeout: 10s
      compensation: UNDO_REGISTER_LIEN
      events:
        started: REGISTER_LIEN_STARTED
        completed: REGISTER_LIEN_DONE
        failed: REGISTER_LIEN_FAILED

    - id: OPEN_LOAN_ACCOUNT
      service: account-service
      timeout: 10s
      compensation: UNDO_OPEN_LOAN_ACCOUNT
      events:
        started: OPEN_LOAN_ACCOUNT_STARTED
        completed: OPEN_LOAN_ACCOUNT_DONE
        failed: OPEN_LOAN_ACCOUNT_FAILED

    - id: SETUP_REPAYMENT
      service: repayment-service
      timeout: 10s
      compensation: UNDO_SETUP_REPAYMENT
      events:
        started: SETUP_REPAYMENT_STARTED
        completed: SETUP_REPAYMENT_DONE
        failed: SETUP_REPAYMENT_FAILED

    - id: DISBURSE_FUNDS
      service: disbursement-service
      timeout: 10s
      compensation: UNDO_DISBURSE_FUNDS
      events:
        started: DISBURSE_FUNDS_STARTED
        completed: DISBURSE_FUNDS_DONE
        failed: DISBURSE_FUNDS_FAILED

    - id: NOTIFY_CUSTOMER
      service: notification-service
      timeout: 10s
      compensation: UNDO_NOTIFY_CUSTOMER
      events:
        started: NOTIFY_CUSTOMER_STARTED
        completed: NOTIFY_CUSTOMER_DONE
        failed: NOTIFY_CUSTOMER_FAILED

    - id: ARCHIVE_DOSSIER
      service: archive-service
      timeout: 10s
      compensation: UNDO_ARCHIVE_DOSSIER
      events:
        started: ARCHIVE_DOSSIER_STARTED
        completed: ARCHIVE_DOSSIER_DONE
        failed: ARCHIVE_DOSSIER_FAILED

  compensationSteps:
    - id: UNDO_RECEIVE_APPLICATION
      service: intake-service
      timeout: 10s
      events:
        started: UNDO_RECEIVE_APPLICATION_STARTED
        completed: UNDO_RECEIVE_APPLICATION_DONE

    - id: UNDO_VERIFY_IDENTITY
      service: identity-service
      timeout: 10s
      events:
        started: UNDO_VERIFY_IDENTITY_STARTED
        completed: UNDO_VERIFY_IDENTITY_DONE

    - id: UNDO_CHECK_BLACKLIST
      service: blacklist-service
      timeout: 10s
      events:
        started: UNDO_CHECK_BLACKLIST_STARTED
        completed: UNDO_CHECK_BLACKLIST_DONE

    - id: UNDO_PULL_CREDIT_REPORT
