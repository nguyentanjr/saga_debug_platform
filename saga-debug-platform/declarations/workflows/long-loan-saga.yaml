      condition: FAILED
    - from: PRICE_LOAN
      to: RESERVE_FUNDS
      condition: SUCCESS
    - from: RESERVE_FUNDS
      to: COMPENSATING
      condition: FAILED
    - from: RESERVE_FUNDS
      to: APPROVE_RISK
      condition: SUCCESS
    - from: APPROVE_RISK
      to: COMPENSATING
      condition: FAILED
    - from: APPROVE_RISK
      to: GENERATE_CONTRACT
      condition: SUCCESS
    - from: GENERATE_CONTRACT
      to: COMPENSATING
      condition: FAILED
    - from: GENERATE_CONTRACT
