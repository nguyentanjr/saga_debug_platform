      condition: SUCCESS
    - from: REGISTER_LIEN
      to: COMPENSATING
      condition: FAILED
    - from: REGISTER_LIEN
      to: OPEN_LOAN_ACCOUNT
      condition: SUCCESS
    - from: OPEN_LOAN_ACCOUNT
      to: COMPENSATING
      condition: FAILED
    - from: OPEN_LOAN_ACCOUNT
      to: SETUP_REPAYMENT
      condition: SUCCESS
    - from: SETUP_REPAYMENT
      to: COMPENSATING
      condition: FAILED
    - from: SETUP_REPAYMENT
      to: DISBURSE_FUNDS
      condition: SUCCESS
    - from: DISBURSE_FUNDS
      to: COMPENSATING
      condition: FAILED
    - from: DISBURSE_FUNDS
      to: NOTIFY_CUSTOMER
      condition: SUCCESS
    - from: NOTIFY_CUSTOMER
      to: COMPENSATING
      condition: FAILED
    - from: NOTIFY_CUSTOMER
      to: ARCHIVE_DOSSIER
      condition: SUCCESS
    - from: ARCHIVE_DOSSIER
      to: COMPENSATING
      condition: FAILED
    - from: ARCHIVE_DOSSIER
      to: COMPLETED
      condition: SUCCESS
    - from: UNDO_RECEIVE_APPLICATION
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_VERIFY_IDENTITY
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_CHECK_BLACKLIST
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_PULL_CREDIT_REPORT
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_SCORE_CREDIT
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_VERIFY_INCOME
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_VERIFY_EMPLOYMENT
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_APPRAISE_COLLATERAL
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_INSURE_COLLATERAL
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_PRICE_LOAN
      to: COMPENSATED
      condition: SUCCESS
    - from: UNDO_RESERVE_FUNDS
