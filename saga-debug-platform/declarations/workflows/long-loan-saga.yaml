      events:
        started: UNDO_GENERATE_CONTRACT_STARTED
        completed: UNDO_GENERATE_CONTRACT_DONE

    - id: UNDO_SIGN_CONTRACT
      service: esign-service
      timeout: 10s
      events:
        started: UNDO_SIGN_CONTRACT_STARTED
        completed: UNDO_SIGN_CONTRACT_DONE

    - id: UNDO_REGISTER_LIEN
      service: lien-service
      timeout: 10s
      events:
        started: UNDO_REGISTER_LIEN_STARTED
        completed: UNDO_REGISTER_LIEN_DONE

    - id: UNDO_OPEN_LOAN_ACCOUNT
      service: account-service
      timeout: 10s
      events:
        started: UNDO_OPEN_LOAN_ACCOUNT_STARTED
        completed: UNDO_OPEN_LOAN_ACCOUNT_DONE

    - id: UNDO_SETUP_REPAYMENT
      service: repayment-service
      timeout: 10s
      events:
        started: UNDO_SETUP_REPAYMENT_STARTED
        completed: UNDO_SETUP_REPAYMENT_DONE

    - id: UNDO_DISBURSE_FUNDS
      service: disbursement-service
      timeout: 10s
      events:
        started: UNDO_DISBURSE_FUNDS_STARTED
        completed: UNDO_DISBURSE_FUNDS_DONE

    - id: UNDO_NOTIFY_CUSTOMER
      service: notification-service
      timeout: 10s
      events:
        started: UNDO_NOTIFY_CUSTOMER_STARTED
        completed: UNDO_NOTIFY_CUSTOMER_DONE

    - id: UNDO_ARCHIVE_DOSSIER
      service: archive-service
      timeout: 10s
      events:
        started: UNDO_ARCHIVE_DOSSIER_STARTED
        completed: UNDO_ARCHIVE_DOSSIER_DONE

  transitions:
    - from: STARTED
      to: RECEIVE_APPLICATION
    - from: RECEIVE_APPLICATION
      to: FAILED
      condition: FAILED
    - from: RECEIVE_APPLICATION
      to: VERIFY_IDENTITY
      condition: SUCCESS
    - from: VERIFY_IDENTITY
      to: COMPENSATING
      condition: FAILED
    - from: VERIFY_IDENTITY
      to: CHECK_BLACKLIST
      condition: SUCCESS
    - from: CHECK_BLACKLIST
      to: COMPENSATING
      condition: FAILED
    - from: CHECK_BLACKLIST
      to: PULL_CREDIT_REPORT
      condition: SUCCESS
    - from: PULL_CREDIT_REPORT
      to: COMPENSATING
      condition: FAILED
    - from: PULL_CREDIT_REPORT
      to: SCORE_CREDIT
      condition: SUCCESS
    - from: SCORE_CREDIT
      to: COMPENSATING
      condition: FAILED
    - from: SCORE_CREDIT
      to: VERIFY_INCOME
      condition: SUCCESS
    - from: VERIFY_INCOME
      to: COMPENSATING
      condition: FAILED
    - from: VERIFY_INCOME
      to: VERIFY_EMPLOYMENT
      condition: SUCCESS
    - from: VERIFY_EMPLOYMENT
      to: COMPENSATING
      condition: FAILED
    - from: VERIFY_EMPLOYMENT
      to: APPRAISE_COLLATERAL
      condition: SUCCESS
    - from: APPRAISE_COLLATERAL
      to: COMPENSATING
      condition: FAILED
    - from: APPRAISE_COLLATERAL
      to: INSURE_COLLATERAL
      condition: SUCCESS
    - from: INSURE_COLLATERAL
      to: COMPENSATING
      condition: FAILED
    - from: INSURE_COLLATERAL
